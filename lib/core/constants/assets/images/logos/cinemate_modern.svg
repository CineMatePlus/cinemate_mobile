<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Modern play icon -->
  <polygon points="20,20 20,40 35,30" fill="url(#grad1)"/>
  
  <!-- CineMate text with modern font -->
  <text x="50" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#1a1a1a">CINE</text>
  <text x="50" y="42" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="url(#grad2)">MATE</text>
  
  <!-- Modern accent line -->
  <rect x="50" y="45" width="80" height="2" fill="url(#grad1)"/>
  
  <!-- Geometric decorations -->
  <rect x="140" y="18" width="4" height="4" fill="#ff4444" transform="rotate(45 142 20)"/>
  <rect x="150" y="28" width="4" height="4" fill="#666" transform="rotate(45 152 30)"/>
  <rect x="160" y="38" width="4" height="4" fill="#1a1a1a" transform="rotate(45 162 40)"/>
</svg> 