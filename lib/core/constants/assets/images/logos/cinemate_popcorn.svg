<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Popcorn container -->
  <polygon points="20,30 30,70 50,70 60,30" fill="#ff4444"/>
  <polygon points="22,32 28,68 52,68 58,32" fill="#fff"/>
  
  <!-- Popcorn pieces -->
  <circle cx="25" cy="25" r="3" fill="#ffeb3b"/>
  <circle cx="30" cy="20" r="2.5" fill="#fff9c4"/>
  <circle cx="35" cy="22" r="2" fill="#ffeb3b"/>
  <circle cx="40" cy="18" r="3" fill="#fff9c4"/>
  <circle cx="45" cy="25" r="2.5" fill="#ffeb3b"/>
  <circle cx="50" cy="20" r="2" fill="#fff9c4"/>
  <circle cx="55" cy="25" r="3" fill="#ffeb3b"/>
  
  <!-- Additional scattered popcorn -->
