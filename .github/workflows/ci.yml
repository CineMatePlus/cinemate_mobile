name: Mobile CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6655482ec06e547f90abf8ae7590466f4415978d"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --jdk-dir="$JAVA_HOME"
      - run: flutter pub get --enforce-lockfile
      - run: python3 scripts/generate.py
      - name: Check generated models
        run: git diff --exit-code -- 'lib/**/*.g.dart' 'lib/**/*.freezed.dart'
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: python3 scripts/audit_dependencies.py
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug-and-coverage
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            coverage/lcov.info
      - name: Scan secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --no-banner --redact
  android-integration:
    runs-on: ubuntu-latest
    env:
      MONGODB_DB: cinemate_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter and backend
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "6655482ec06e547f90abf8ae7590466f4415978d"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          git clone https://github.com/CineMatePlus/cinemate_backend.git "$RUNNER_TEMP/backend"
          git -C "$RUNNER_TEMP/backend" checkout "$(cat .backend-ref)"
          docker compose -f "$RUNNER_TEMP/backend/docker-compose.yml" up -d --build --wait
      - run: flutter config --jdk-dir="$JAVA_HOME"
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: flutter test integration_test/auth_test.dart --dart-define=API_BASE_URL=http://10.0.2.2:8000
      - name: Backend diagnostics
        if: failure()
        run: docker compose -f "$RUNNER_TEMP/backend/docker-compose.yml" logs --no-color
      - name: Stop isolated CI services
        if: always()
        run: docker compose -f "$RUNNER_TEMP/backend/docker-compose.yml" down -v
