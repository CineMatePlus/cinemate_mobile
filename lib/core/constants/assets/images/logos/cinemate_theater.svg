<svg width="180" height="100" viewBox="0 0 180 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Theater curtains -->
  <path d="M20 20 Q30 15 40 20 L40 70 Q30 75 20 70 Z" fill="#8b0000"/>
  <path d="M140 20 Q150 15 160 20 L160 70 Q150 75 140 70 Z" fill="#8b0000"/>
  
  <!-- Screen -->
  <rect x="40" y="25" width="100" height="60" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
  
  <!-- Screen glow -->
  <rect x="42" y="27" width="96" height="56" fill="#fff" opacity="0.3"/>
  
  <!-- Theater seats -->
  <rect x="50" y="80" width="8" height="6" fill="#2c2c2c" rx="2"/>
  <rect x="62" y="80" width="8" height="6" fill="#2c2c2c" rx="2"/>
  <rect x="74" y="80" width="8" height="6" fill="#2c2c2c" rx="2"/>
  <rect x="86" y="80" width="8" height="6" fill="#2c2c2c" rx="2"/>
  <rect x="98" y="80" width="8" height="6" fill="#2c2c2c" rx="2"/>
  <rect x="110" y="80" width="8" height="6" fill="#2c2c2c" rx="2"/>
  <rect x="122" y="80" width="8" height="6" fill="#2c2c2c" rx="2"/>
  
  <!-- CineMate Text on screen -->
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">CINE</text>
  <text x="90" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b0000">MATE</text>
  
  <!-- Decorative elements -->
  <circle cx="25" cy="15" r="3" fill="#ffd700"/>
  <circle cx="155" cy="15" r="3" fill="#ffd700"/>
</svg> 