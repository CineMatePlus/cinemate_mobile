<svg width="220" height="70" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
  <!-- Projector Body -->
  <rect x="20" y="25" width="50" height="30" fill="#2c2c2c" rx="6"/>
  
  <!-- Projector Lens -->
  <circle cx="75" cy="40" r="15" fill="#1a1a1a"/>
  <circle cx="75" cy="40" r="10" fill="#333"/>
  <circle cx="75" cy="40" r="6" fill="#666"/>
  
  <!-- Light beam -->
  <polygon points="90,35 140,20 140,60 90,45" fill="#ffeb3b" opacity="0.3"/>
  
  <!-- Film reels -->
  <circle cx="30" cy="15" r="8" fill="#666"/>
  <circle cx="30" cy="15" r="5" fill="#333"/>
  <circle cx="30" cy="15" r="2" fill="#1a1a1a"/>
  
  <circle cx="60" cy="15" r="8" fill="#666"/>
  <circle cx="60" cy="15" r="5" fill="#333"/>
  <circle cx="60" cy="15" r="2" fill="#1a1a1a"/>
  
  <!-- Projector details -->
  <rect x="25" y="35" width="4" height="4" fill="#ff4444"/>
  <rect x="25" y="42" width="6" height="2" fill="#666"/>
  
  <!-- CineMate Text -->
  <text x="150" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Cine</text>
  <text x="150" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#666">Mate</text>
</svg> 