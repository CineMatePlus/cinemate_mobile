<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular background -->
  <circle cx="60" cy="60" r="55" fill="#1a1a1a"/>
  
  <!-- Film strip around circle -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#333" stroke-width="10" stroke-dasharray="8 4"/>
  
  <!-- Play button in center -->
  <polygon points="45,40 45,80 80,60" fill="#ff4444"/>
  
  <!-- Film holes decoration -->
  <circle cx="30" cy="30" r="2" fill="#666"/>
  <circle cx="90" cy="30" r="2" fill="#666"/>
  <circle cx="30" cy="90" r="2" fill="#666"/>
  <circle cx="90" cy="90" r="2" fill="#666"/>
  
  <!-- Text around the bottom -->
  <path id="circle-text" d="M 20 60 A 40 40 0 0 1 100 60" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    <textPath href="#circle-text" startOffset="25%">CineMate</textPath>
  </text>
</svg> 