<svg width="180" height="80" viewBox="0 0 180 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Camera Body -->
  <rect x="30" y="25" width="40" height="30" fill="#2c2c2c" rx="4"/>
  <rect x="70" y="30" width="20" height="20" fill="#1a1a1a" rx="2"/>
  
  <!-- Camera Lens -->
  <circle cx="80" cy="40" r="12" fill="#333"/>
  <circle cx="80" cy="40" r="8" fill="#1a1a1a"/>
  <circle cx="80" cy="40" r="5" fill="#666"/>
  <circle cx="82" cy="38" r="2" fill="#999"/>
  
  <!-- Camera Details -->
  <rect x="35" y="28" width="6" height="3" fill="#666"/>
  <rect x="35" y="33" width="4" height="2" fill="#666"/>
  <circle cx="65" cy="32" r="2" fill="#ff4444"/>
  
  <!-- Film coming out -->
  <rect x="25" y="38" width="8" height="4" fill="#1a1a1a"/>
  <rect x="20" y="40" width="15" height="2" fill="#333"/>
  
  <!-- CineMate Text -->
  <text x="90" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">Cine</text>
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff4444">Mate</text>
</svg> 