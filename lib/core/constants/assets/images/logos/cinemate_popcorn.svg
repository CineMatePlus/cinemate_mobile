  <circle cx="105" cy="44" r="1.5" fill="white"/>
  
  <!-- CineMate Text -->
  <text x="120" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a1a">Cine</text>
  <text x="120" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff4444">Mate</text>
</svg> 